version: "3.9"
services:
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8081:8080"   # Spark Master UI on http://localhost:8081
    volumes:
      - ../spark:/opt/spark-apps
      - ../data:/opt/data

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ../spark:/opt/spark-apps
      - ../data:/opt/data
